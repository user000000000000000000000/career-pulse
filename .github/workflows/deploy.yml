name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Check FSD architecture (steiger)
        working-directory: frontend
        run: npm run check:arch

      - name: Scoring tests
        working-directory: frontend
        run: npm test

      - name: Build (GitHub Pages, base=/career-pulse/)
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      # Prod-сборка для reg.ru (base=/). Выкладываем артефактом, чтобы скачать
      # гарантированно правильную сборку и залить на reg.ru — без локального build:prod.
      - name: Build (reg.ru prod, base=/)
        working-directory: frontend
        run: npm run build:prod

      - name: Upload reg.ru dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-reg-ru
          path: frontend/dist
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
